name: Bug
description: Incorrect or broken behavior.
title: "[Bug] "
labels: ["level: story", "kind: bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
      placeholder: "What happened?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: "What should happen?"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / Evidence
      placeholder: |
        1. ...
        2. ...
        Evidence:
    validations:
      required: true
  - type: dropdown
    id: target_repo
    attributes:
      label: Target Repo
      options:
        - docs
        - platform-api
        - tg-miniapp
        - tg-bot
        - contracts
        - platform-ops
        - unknown
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Use severity for impact; use Priority for scheduling.
      options:
        - S0 Critical
        - S1 High
        - S2 Medium
        - S3 Low
    validations:
      required: true
  - type: dropdown
    id: bug_type
    attributes:
      label: Bug Type
      options:
        - Regression
        - Production
        - API
        - UI
        - Integration
        - CI
        - Security
        - Data
        - Flaky Test
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local
        - Dev
        - Staging
        - Production
        - CI
        - Telegram
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Always
        - Intermittent
        - Once
        - Cannot Reproduce
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact / Blast Radius
      placeholder: |
        Users affected:
        Data/security risk:
        Rollback or mitigation:
    validations:
      required: true
  - type: textarea
    id: triage
    attributes:
      label: Triage Checklist
      value: |
        - [ ] Observed behavior is described.
        - [ ] Expected behavior is described.
        - [ ] Reproduction steps or evidence exist.
        - [ ] Affected repo/component is known.
        - [ ] Severity and priority are set.
        - [ ] Regression/security/data risk is noted where relevant.
        - [ ] Workaround or mitigation is documented if needed.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Fix Verification
      value: |
        - [ ] Root cause is identified.
        - [ ] Fix is implemented.
        - [ ] Regression test or equivalent evidence exists.
        - [ ] Original reproduction no longer fails.
        - [ ] No broader behavior regression is introduced.
    validations:
      required: true
