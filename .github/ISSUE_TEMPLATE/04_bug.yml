name: Bug
description: Incorrect or broken behavior.
title: "[Bug] "
labels: ["kind: bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed Behavior
      placeholder: "What happened?"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: "What should happen?"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / Evidence
      placeholder: |
        1. ...
        2. ...
        Evidence:
    validations:
      required: true
  - type: dropdown
    id: target_repo
    attributes:
      label: Target Repo
      options:
        - docs
        - platform-api
        - tg-miniapp
        - tg-bot
        - contracts
        - platform-ops
        - unknown
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Fix Verification
      value: |
        - [ ] Root cause is identified.
        - [ ] Fix is implemented.
        - [ ] Regression test or equivalent evidence exists.
        - [ ] Original reproduction no longer fails.
        - [ ] No broader behavior regression is introduced.
    validations:
      required: true
